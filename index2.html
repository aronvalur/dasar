<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dasar Merkingar — Sölumælaborð (sýnidæmi)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --card-bg: #0E0F11;
    --panel: #1A1B1F;
    --panel-2: #232429;
    --ink: #F3F4F6;
    --ink-muted: #8B8D95;
    --line: #2B2C31;
    --up: #34C77B; --up-bg: #34C77B1F;
    --down: #E5544B; --down-bg: #E5544B1F;
    --dot1: #2DD4BF; --dot2: #60A5FA; --dot3: #A78BFA; --dot4: #FBBF24;
    --new: #60A5FA; --returning: #34C77B;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  :root[data-theme="light"] {
    --card-bg: #FFFFFF;
    --panel: #F5F5F7;
    --panel-2: #EBEBEE;
    --ink: #14151A;
    --ink-muted: #6B6D76;
    --line: #DEDEE2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: var(--card-bg); font-family: var(--font); -webkit-font-smoothing: antialiased; }

  .dashboard-card { height: 100vh; background: var(--card-bg); display: flex; color: var(--ink); overflow: hidden; }

  .sidebar { width: 176px; flex-shrink: 0; display: flex; flex-direction: column; padding: 16px 14px; }
  .logo-box { padding: 4px 6px 16px; }
  .logo-box img { height: 20px; width: auto; filter: brightness(0) invert(1); display: block; }

  .nav-group { display: flex; flex-direction: column; gap: 2px; }
  .navbtn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: none; color: var(--ink-muted); padding: 8px 10px; border-radius: 8px; font-family: var(--font); font-size: 13px; font-weight: 500; cursor: pointer; }
  .navbtn svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.8; }
  .navbtn.active { background: var(--panel); color: var(--ink); font-weight: 600; }
  .navbtn.active svg { opacity: 1; }

  .sidebar-spacer { flex: 1; }
  .nav-secondary { border-top: 1px solid var(--line); padding-top: 8px; }
  .theme-toggle { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; background: var(--panel); color: var(--ink-muted); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; padding: 0; margin-top: 8px; }
  .theme-toggle:hover { color: var(--ink); }
  .theme-toggle svg { width: 15px; height: 15px; display: block; }

  main { flex: 1; min-width: 0; padding: 12px 18px; display: flex; height: 100vh; overflow: hidden; }
  main .content-wrap { max-width: 1600px; flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  main .content-wrap > div { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 12px; flex-wrap: wrap; flex-shrink: 0; }
  header h1 { font-size: 19px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  header .sub { color: var(--ink-muted); font-size: 11.5px; margin-top: 1px; }

  .live-badge { display: inline-flex; align-items: center; gap: 7px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); font-weight: 600; font-size: 11.5px; padding: 6px 12px; border-radius: 999px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--up); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .period-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; flex-shrink: 0; }
  .range-toggle { display: flex; gap: 3px; background: var(--panel-2); padding: 3px; border-radius: 8px; }
  .range-btn { background: none; border: none; color: var(--ink-muted); font-family: var(--font); font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  .range-btn.active { background: var(--card-bg); color: var(--ink); }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 6px; flex-shrink: 0; }
  @media (max-width: 640px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
  .stat { background: var(--panel); border-radius: 10px; padding: 10px 13px; }
  .stat-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
  .stat .label { font-size: 10px; color: var(--ink-muted); }
  .trend { font-size: 9.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; }
  .trend.up { background: var(--up-bg); color: var(--up); }
  .trend.down { background: var(--down-bg); color: var(--down); }
  .stat .figure { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; margin-bottom: 2px; }
  .stat .sub-trend { font-size: 10px; color: var(--ink-muted); }
  .stat .sub-trend.up { color: var(--up); }
  .stat .sub-trend.down { color: var(--down); }

  .row-2-1 { display: grid; grid-template-columns: 1.7fr 1fr; gap: 8px; margin-bottom: 6px; flex: 1.3; min-height: 0; }
  @media (max-width: 700px) { .row-2-1 { grid-template-columns: 1fr; flex: none; } }

  .row-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; flex: 0.85; min-height: 0; }
  @media (max-width: 700px) { .row-2col { grid-template-columns: 1fr; } }

  .panel-box { background: var(--panel); border-radius: 10px; padding: 10px 14px; overflow: hidden; }
  .row-2-1 .panel-box, .row-2col .panel-box { display: flex; flex-direction: column; height: 100%; overflow-y: auto; }
  .row-2-1 #sparkline { flex: 1; min-height: 0; }

  .chart-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 2px; }
  .panel-title { font-size: 13px; font-weight: 700; margin: 0; }
  .panel-sub { font-size: 11px; color: var(--ink-muted); margin: 3px 0 0; }
  .chart-total-wrap { text-align: right; }
  .chart-total { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; }

  .spark-labels { display: flex; justify-content: space-between; margin-top: 4px; }
  .spark-labels span { font-size: 10px; color: var(--ink-muted); }

  .stage-cols { display: flex; justify-content: space-between; margin-top: 14px; gap: 8px; }
  .stage-col { flex: 1; text-align: center; }
  .stage-col .sc-num { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .stage-col .sc-label { font-size: 10.5px; color: var(--ink-muted); margin-bottom: 8px; }
  .dots { display: flex; justify-content: center; gap: 2.5px; }
  .dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
  .dots span.on { background: var(--ink); }

  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .cat-item { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-muted); margin-bottom: 2px; }
  .cat-item .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .cat-val { font-size: 13px; font-weight: 700; color: var(--ink); }

  .lead-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .lead-row:last-child { border-bottom: none; }
  .lead-rank { width: 16px; font-size: 10.5px; color: var(--ink-muted); font-weight: 700; flex-shrink: 0; }
  .lead-name { flex: 1; font-size: 12px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lead-val { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }

  .split-bar { display: flex; height: 8px; border-radius: 5px; overflow: hidden; margin: 8px 0 8px; background: var(--panel-2); }
  .split-bar .seg-new { background: var(--new); }
  .split-bar .seg-ret { background: var(--returning); }
  .split-legend { display: flex; justify-content: space-between; }
  .split-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-muted); }
  .split-item .dot { width: 7px; height: 7px; border-radius: 50%; }
  .split-item b { color: var(--ink); font-size: 13px; margin-left: 3px; }

  .feed-panel .panel-box { padding: 10px 0 4px; }
  .feed-panel .panel-title { padding: 0 14px; margin-bottom: 6px; }
  .feed-item { display: flex; align-items: center; gap: 9px; padding: 6px 14px; border-top: 1px solid var(--line); font-size: 11.5px; animation: slidein 0.35s ease; }
  .feed-item:first-of-type { border-top: none; }
  .feed-item .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .feed-item .fi-body { flex: 1; min-width: 0; }
  .feed-item .fi-main { font-weight: 600; }
  .feed-item .fi-sub { color: var(--ink-muted); font-size: 10px; }
  .feed-item .fi-amount { font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  @keyframes slidein { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

  .disclaimer { text-align: center; font-size: 10px; color: var(--ink-muted); margin-top: 6px; flex-shrink: 0; }

  .table-wrap { background: var(--panel); border-radius: 12px; overflow-y: auto; flex: 1; min-height: 0; }
  table.orders-table { width: 100%; border-collapse: collapse; }
  .orders-table thead th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-muted); font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
  .orders-table tbody td { padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .orders-table tbody tr:last-child td { border-bottom: none; }
  .ord-service { display: flex; align-items: center; gap: 7px; }
  .ord-service .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .cell-main { font-weight: 600; }
  .cell-sub { color: var(--ink-muted); font-size: 11.5px; margin-top: 2px; }
  .stage-pill { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .stage-pill.received { background: var(--panel-2); color: var(--ink-muted); }
  .stage-pill.progress { background: #FBBF2422; color: #FBBF24; }
  .stage-pill.done { background: var(--up-bg); color: var(--up); }
  .empty-row { text-align: center; color: var(--ink-muted); padding: 30px 16px; }

  .form-panel { background: var(--panel); border: 1px dashed var(--ink-muted); border-radius: 12px; padding: 16px; margin-bottom: 14px; }

  @media (max-width: 760px) {
    .dashboard-card { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 14px 16px; }
    .logo-box { padding: 0; margin-right: 14px; }
    .nav-group { flex-direction: row; }
    .sidebar-spacer { display: none; }
    .nav-secondary { display: none; }
    main { padding: 18px 16px 24px; }
    .orders-table thead { display: none; }
    .orders-table, .orders-table tbody, .orders-table tr, .orders-table td { display: block; width: 100%; }
    .orders-table tbody tr { padding: 10px 16px; }
    .orders-table tbody td { border-bottom: none; padding: 2px 0; }
  }

  .unavailable { max-width: 480px; margin: 60px auto; text-align: center; color: var(--ink-muted); }
</style>
</head>

<script>
const SERVICES = [
  { name: 'DTF filmur', color: 'var(--dot1)' },
  { name: 'Gluggamerkingar', color: 'var(--dot2)' },
  { name: 'Bílamerkingar', color: 'var(--dot3)' },
  { name: 'Bródering', color: 'var(--dot4)' },
];
const CLIENTS = ['Krónan Granda', 'Húsasmiðjan', 'Verkfræðistofan EFLA', 'Kaffitár', 'N1 Bíldshöfða', 'Íþróttafélagið Fram', 'Bókakaffi', 'Sjúkraþjálfun Reykjavíkur', 'Málningarþjónustan', 'Blómaval', 'Te og Kaffi', 'Origo'];
const STAGES = [
  { key: 'received', label: 'Móttekið' },
  { key: 'progress', label: 'Í vinnslu' },
  { key: 'done', label: 'Tilbúið' },
];
const STAGE_LABEL = { received: 'Móttekið', progress: 'Í vinnslu', done: 'Tilbúið' };

const PERIODS = [
  { key: 'day', label: 'Í dag' },
  { key: 'week', label: '7 daga' },
  { key: 'month', label: '30 daga' },
];
let selectedPeriod = 'day';

const DESCRIPTIONS = {
  'DTF filmur': ['3 stk. — merki á boli', '10 stk. — merki á húfur', '25 stk. — merki á peysur (starfsmannafatnaður)', '1 stk. — stórt bakmerki', '15 stk. — merki á stuttermaboli', '5 stk. — merki á hettupeysur'],
  'Gluggamerkingar': ['Merking á framglugga verslunar', 'Sandblástursfilma á 2 glugga', 'Stór útstillingargluggamerking', 'Merking á inngangshurð'],
  'Bílamerkingar': ['Hálfmerking á sendibíl', 'Merking á 3 bíla (bílafloti)', 'Lógó og símanúmer á hurðir', 'Heilmerking á flutningabíl'],
  'Bródering': ['Bródering á 5 peysur', 'Merki á vinnuföt (8 stk.)', 'Bródering á húfur (12 stk.)', 'Merki á taupoka (20 stk.)'],
};
function randomDescription(serviceName) { return pick(DESCRIPTIONS[serviceName] || ['Sérpöntun']); }

function fmtKr(n) { return Math.round(n).toLocaleString('is-IS') + ' kr.'; }
function serviceColor(name) { const s = SERVICES.find(s => s.name === name); return s ? s.color : 'var(--dot1)'; }
function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* ---------- seed today's live state ---------- */

let revenue = 0;
let orderCount = 0;
let catTotals = { 'DTF filmur': 0, 'Gluggamerkingar': 0, 'Bílamerkingar': 0, 'Bródering': 0 };
let queue = [];
let allOrders = []; // today's orders, newest first: {client, service, amount, time, stage, source}

function seedToday() {
  const now = new Date();
  const seedCount = 10;
  for (let i = seedCount - 1; i >= 0; i--) {
    const service = pick(SERVICES);
    const client = pick(CLIENTS);
    const amount = randInt(2500, 14500);
    const minutesAgo = i * 22 + randInt(0, 8);
    const time = new Date(now.getTime() - minutesAgo * 60000);
    const stage = i > 6 ? 'done' : (i > 2 ? 'progress' : 'received');
    revenue += amount;
    orderCount += 1;
    catTotals[service.name] += amount;
    allOrders.push({ client, service: service.name, description: randomDescription(service.name), amount, time, stage, source: 'live', comment: '' });
  }
  // keep a small live queue mirroring the most recent non-done ones
  queue = allOrders.filter(o => o.stage !== 'done').slice(0, 6).map(o => ({ client: o.client, service: o.service, stage: o.stage }));
}
seedToday();

let hourly = (() => {
  // reconstruct a rough cumulative hourly curve ending at current revenue
  const points = 8;
  const arr = [];
  for (let i = 0; i < points - 1; i++) arr.push(Math.round(revenue * ((i + 1) / points) * (0.7 + Math.random() * 0.3)));
  arr.sort((a, b) => a - b);
  arr.push(revenue);
  return arr;
})();
const hourLabels = (() => {
  const arr = []; const nowH = new Date().getHours();
  for (let i = hourly.length - 1; i >= 0; i--) arr.push(String((nowH - i + 24) % 24).padStart(2,'0') + ':00');
  return arr;
})();

/* ---------- synthetic history for week/month views ---------- */

function genPastDayOrders() {
  const n = randInt(2, 7);
  const arr = [];
  for (let i = 0; i < n; i++) {
    arr.push({ client: pick(CLIENTS), service: pick(SERVICES).name, amount: randInt(2500, 14500) });
  }
  return arr;
}
const pastDays = []; // index 0 = yesterday ... 29 = 30 days ago
for (let i = 0; i < 29; i++) pastDays.push(genPastDayOrders());

const clientAppearanceCount = {};
pastDays.flat().forEach(o => { clientAppearanceCount[o.client] = (clientAppearanceCount[o.client] || 0) + 1; });
function isReturning(client) { return (clientAppearanceCount[client] || 0) >= 2; }

function todayFlat() { return allOrders.map(o => ({ client: o.client, service: o.service, amount: o.amount })); }

function getPeriodOrders(period) {
  if (period === 'day') return todayFlat();
  if (period === 'week') return [...todayFlat(), ...pastDays.slice(0, 6).flat()];
  return [...todayFlat(), ...pastDays.slice(0, 29).flat()];
}

function getDailySeries(period) {
  // returns [{label, total}] oldest -> newest, ending with today
  if (period === 'day') return null; // uses hourly chart instead
  const days = period === 'week' ? 6 : 29;
  const series = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - (i + 1));
    const total = pastDays[i].reduce((s, o) => s + o.amount, 0);
    series.push({ label: d.toLocaleDateString('is-IS', { day: '2-digit', month: '2-digit' }), total });
  }
  series.push({ label: 'Í dag', total: revenue });
  return series;
}

function computeStats(period) {
  const orders = getPeriodOrders(period);
  const rev = orders.reduce((s, o) => s + o.amount, 0);
  const count = orders.length;
  const avg = count ? rev / count : 0;
  const cat = { 'DTF filmur': 0, 'Gluggamerkingar': 0, 'Bílamerkingar': 0, 'Bródering': 0 };
  const clientRevenue = {};
  orders.forEach(o => {
    cat[o.service] = (cat[o.service] || 0) + o.amount;
    clientRevenue[o.client] = (clientRevenue[o.client] || 0) + o.amount;
  });
  const distinctClients = Object.keys(clientRevenue);
  const returningCount = distinctClients.filter(isReturning).length;
  const newCount = distinctClients.length - returningCount;
  const topClients = distinctClients
    .map(c => ({ client: c, value: clientRevenue[c] }))
    .sort((a, b) => b.value - a.value)
    .slice(0, 5);
  return { revenue: rev, orderCount: count, avg, cat, distinctClients: distinctClients.length, returningCount, newCount, topClients };
}

function trendFromSeries(series) {
  if (!series || series.length < 2) return { cls: 'up', text: '+0%' };
  const first = series[0].total || 1;
  const last = series[series.length - 1].total;
  const pct = ((last - first) / first) * 100;
  const up = pct >= 0;
  return { cls: up ? 'up' : 'down', text: (up ? '+' : '') + pct.toFixed(0) + '%' };
}

function renderSparkline(series) {
  const svg = document.getElementById('sparkline');
  if (!svg) return;
  const values = series.map(p => p.total);
  const w = 400, h = 80, pad = 4;
  const max = Math.max(...values, 1);
  const min = Math.min(...values, 0);
  const range = (max - min) || 1;
  const step = (w - pad * 2) / (values.length - 1 || 1);
  const pts = values.map((v, i) => [pad + i * step, h - pad - ((v - min) / range) * (h - pad * 2)]);
  const linePath = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${pts[pts.length-1][0].toFixed(1)},${h} L${pts[0][0].toFixed(1)},${h} Z`;
  svg.innerHTML = `
    <defs><linearGradient id="sparkfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34C77B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#34C77B" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaPath}" fill="url(#sparkfill)" stroke="none"></path>
    <path d="${linePath}" fill="none" stroke="#34C77B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
    <circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3.5" fill="#34C77B"></circle>
  `;
}

        <div class="cat-track" style="max-width:140px;margin-top:6px;"><div class="cat-fill" style="width:${(a.ctr/maxCtr)*100}%;background:${PLATFORM_COLOR[a.platform]}"></div></div>
      </td>
      <td>${a.platform}</td>
      <td>${fmtKr(a.spend)}</td>
      <td>${a.reach.toLocaleString('is-IS')}</td>
      <td>${a.ctr.toFixed(1)}%</td>
      <td>${a.results} <span style="color:var(--ink-muted);font-size:11px;">(${a.resultLabel})</span></td>
      <td>${fmtKr(a.cpr)}${a === best ? ' <span class="stage-pill done" style="margin-left:6px;">Best</span>' : ''}</td>
    </tr>`).join('');
  tableWrap.innerHTML = `
    <table class="orders-table">
      <thead><tr><th>Auglýsing</th><th>Vettvangur</th><th>Eyðsla</th><th>Birtingar</th><th>CTR</th><th>Niðurstöður</th><th>Kostn./niðurstöðu</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  wrap.appendChild(tableWrap);

  const disclaimer = document.createElement('div');
  disclaimer.className = 'disclaimer';
  disclaimer.textContent = 'Sýnidæmi með uppgerðum gögnum — ekki tengt Meta Ads reikningi ennþá. CTR reiknað sem smellir/nágrenni.';
  wrap.appendChild(disclaimer);

  return wrap;
}

/* ---------- live ticking ---------- */

function addOrder() {
  const service = pick(SERVICES);
  const client = pick(CLIENTS);
  const amount = randInt(2500, 14500);
  revenue += amount;
  orderCount += 1;
  catTotals[service.name] = (catTotals[service.name] || 0) + amount;
  hourly[hourly.length - 1] = revenue;

  const newOrder = { client, service: service.name, description: randomDescription(service.name), stage: 'received', amount, time: new Date(), source: 'live', comment: '' };
  queue.unshift({ client, service: service.name, stage: 'received' });
  if (queue.length > 6) queue.pop();
  queue.forEach((q, i) => { if (i > 0 && Math.random() > 0.7 && q.stage !== 'done') q.stage = q.stage === 'received' ? 'progress' : 'done'; });

  allOrders.unshift(newOrder);
  if (allOrders.length > 60) allOrders.pop();

  renderMain();
}

function scheduleNext() {
  const delay = (9 + Math.random() * 2) * 60 * 1000; // ~9-11 minutes
  setTimeout(() => { addOrder(); scheduleNext(); }, delay);
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
}

function initTheme() {
  let saved = 'dark';
  try { saved = localStorage.getItem('dasar-theme') || 'dark'; } catch (e) {}
  applyTheme(saved);
  const btn = document.getElementById('themeToggle');
  if (btn) {
    btn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      const next = current === 'light' ? 'dark' : 'light';
      applyTheme(next);
      try { localStorage.setItem('dasar-theme', next); } catch (e) {}
    });
  }
}

renderNav();
renderMain();
initTheme();
setInterval(tickClock, 1000);
scheduleNext();
</script>
